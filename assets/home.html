<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tesseract</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237aa2f7'/%3E%3Cstop offset='.55' stop-color='%23bb9af7'/%3E%3Cstop offset='1' stop-color='%23f7768e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg fill='none' stroke='url(%23g)' stroke-width='2.4' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='26' height='26' rx='3'/%3E%3Crect x='10' y='10' width='12' height='12' rx='1.5'/%3E%3Cpath d='M3 3l7 7M29 3l-7 7M3 29l7-7M29 29l-7-7'/%3E%3C/g%3E%3C/svg%3E">
<style>
  /* Bundled with the app so the homepage renders offline. */
  @font-face {
    font-family: "Black Ops One";
    src: url("fonts/BlackOpsOne-Regular.ttf") format("truetype");
    font-display: block;
  }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: radial-gradient(ellipse at top, #1e2433 0%, #0f1117 70%);
    color: #e6e9ef;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 {
    margin: 0;
    font-family: "Black Ops One", system-ui, sans-serif;
    font-weight: 400;
    font-size: clamp(56px, 12vw, 140px);
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, #7aa2f7 0%, #bb9af7 55%, #f7768e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(122, 162, 247, 0.15);
  }
  form {
    width: min(560px, 86vw);
  }
  input {
    box-sizing: border-box;
    width: 100%;
    padding: 14px 22px;
    border: 1px solid #2a3142;
    border-radius: 999px;
    background: #171b26;
    color: #e6e9ef;
    font-size: 16px;
    outline: none;
  }
  input:focus {
    border-color: #7aa2f7;
    box-shadow: 0 0 0 3px rgba(122, 162, 247, 0.25);
  }
  p {
    margin: 0;
    color: #6b7489;
    font-size: 13px;
  }
</style>
</head>
<body>
  <h1>Tesseract</h1>
  <form action="https://duckduckgo.com/" method="get">
    <input name="q" placeholder="Search the web" autofocus autocomplete="off">
  </form>
  <p>A browser built to run fast on anything.</p>
</body>
</html>
